<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tipos de Inputs</title>
</head>
<body>

    <h1>Tipos de Inputs</h1>

    <form action="#" method="POST">

       
        <fieldset>
            <legend>Datos personales</legend>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre"><br><br>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password"><br><br>

            <label>Hombre:</label>
            <input type="radio" name="genero" value="hombre" checked> 
            <label>Mujer:</label>
            <input type="radio" name="genero" value="mujer"><br><br>

            <label>Fumador:</label>
            <input type="checkbox" name="fumador">

        </fieldset><br>

        <
        <label for="provincia">Provincia:</label>
        <select id="provincia" name="provincia">
            <option value="toledo" selected>Toledo</option>
            <option value="madrid">Madrid</option>
            <option value="valencia">Valencia</option>
        </select><br><br>

        
        <label for="observaciones">Observaciones:</label><br>
        <textarea id="observaciones" name="observaciones" rows="4" cols="20">Escriba algo...</textarea><br><br>

        
        <label for="color">Color:</label>
        <input type="color" id="color" name="color" value="#000000"><br><br>

        
        <label for="fecha">Fecha de Nacimiento:</label>
        <input type="date" id="fecha" name="fecha"><br><br>

        
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad"><br><br>

        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

       
        <input type="submit" value="Enviar">
        <input type="reset" value="reiniciar formulario">

    </form>

</body>
</html>
